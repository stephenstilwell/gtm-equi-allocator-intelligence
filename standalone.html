function formatNum(x){return Number(x||0).toLocaleString('en-US');}
function countVerified(x){return (x.evidence||[]).filter(y=>y.verified && safeUrl(y.url)).length;}
function scoreParts(x){
 const base=Math.round(Math.max(0,Math.min(100,Number(x.fit)||0))*.30);
 const verified=(x.evidence||[]).filter(e=>e.verified && safeUrl(e.url));
 const signal=Math.min(55,verified.filter(e=>e.kind==='positive').reduce((s,e)=>s+(Number(e.points)||0),0));

 const missing=verified.length ? 4 : 12;
 const quality=x.stage==='Data quality issue'?8:0;
 const value=Math.max(0,Math.min(100,base+signal-risk-missing-quality));
 return {base,signal,risk,missing,quality,value};
}
function confidence(x){const n=countVerified(x);const validPos=(x.evidence||[]).some(e=>e.verified&&safeUrl(e.url)&&e.kind==='positive');return n>=2&&validPos?'Medium':n>=1?'Limited':'Low';}

 if(url&&!safeUrl(url)){toast('Enter a valid HTTP(S) source URL.');return;}
 const points=kind==='positive'?12:kind==='negative'?18:0;
 x.evidence.push({title,detail,url,verified,kind,date,points,type:verified?'Researcher-checked source':'Unverified research note',userAdded:true});save();render();toast('Evidence added. Research priority recalculated.');
}
function handleEvidenceToggle(i,remove=false){const x=accounts.find(y=>y.id===ui.selected);const e=x?.evidence?.[i];if(!e)return;if(remove){if(!e.userAdded)return;x.evidence.splice(i,1);}else{if(!e.verified&&!safeUrl(e.url)){toast('Add a valid URL before marking the source checked.');return;}e.verified=!e.verified;}save();render();toast('Evidence and priority updated.');}
function copyText(s){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>toast('Copied to clipboard.'),()=>fallbackCopy(s));}else fallbackCopy(s);}
function fallbackCopy(s){const ta=document.createElement('textarea');ta.value=s;document.body.append(ta);ta.select();try{document.execCommand('copy');toast('Copied.');}catch{toast('Copy unavailable in this browser.');}ta.remove();}
function action(name){switch(name){case 'view-accounts':setView('accounts');break;case 'export-csv':exportCSV();break;case 'export-json':exportJSON();break;case 'import':$('#csvfile').click();break;case 'copy-draft':{const x=accounts.find(y=>y.id===ui.selected);copyText(makeDraft(x));break;}case 'copy-script':copyText(narration());break;case 'reset':if(confirm('Reset to the original 25-account dataset? Local edits will be discarded.')){accounts=structuredClone(seed);save();setView('overview');toast('Restored original dataset.');}break;}}
window.addEventListener('click',e=>{let link=e.target.closest('[data-view]');if(link){setView(link.dataset.view);return;}link=e.target.closest('[data-open-id]');if(link){ui.selected=link.dataset.openId;if(ui.view==='accounts'){const list=$('#accountList');if(list)list.querySelectorAll('[data-open-id]').forEach(btn=>btn.classList.toggle('active',btn.dataset.openId===ui.selected));const detail=$('#detailPanel');if(detail){detail.innerHTML=renderDetail();detail.scrollTop=0;} }else setView('accounts');return;}link=e.target.closest('[data-action]');if(link){action(link.dataset.action);return;}link=e.target.closest('[data-toggle-evidence]');if(link){handleEvidenceToggle(Number(link.dataset.toggleEvidence));return;}link=e.target.closest('[data-remove-evidence]');if(link){handleEvidenceToggle(Number(link.dataset.removeEvidence),true);return;}});
window.addEventListener('submit',e=>{if(e.target?.id==='evidenceForm'){e.preventDefault();addEvidence();}});
window.addEventListener('input',e=>{if(e.target.id==='search'){ui.query=e.target.value;const focus=e.target.selectionStart;const list=rank().filter(x=>`${x.name} ${x.domain} ${x.city} ${x.state} ${x.analyst}`.toLowerCase().includes(ui.query.toLowerCase()));let filtered=list;if(ui.filter==='verified')filtered=list.filter(x=>countVerified(x)>0);if(ui.filter==='review')filtered=list.filter(x=>countVerified(x)===0);if(ui.filter==='risk')filtered=list.filter(x=>(x.evidence||[]).some(v=>v.kind==='negative'&&v.verified)||x.stage==='Data quality issue');if(ui.sort==='fit')filtered.sort((a,b)=>b.fit-a.fit);if(ui.sort==='name')filtered.sort((a,b)=>a.name.localeCompare(b.name));$('#accountList').innerHTML=renderRows(filtered);$('#tableCount').textContent=`${filtered.length} of ${accounts.length} firms`;e.target.setSelectionRange(focus,focus);} });
window.addEventListener('change',e=>{const x=accounts.find(y=>y.id===ui.selected);switch(e.target?.id){case 'filter':ui.filter=e.target.value;render();break;case 'sort':ui.sort=e.target.value;render();break;case 'accountStage':if(x){x.stage=e.target.value;save();render();}break;case 'accountNote':if(x){x.note=e.target.value;save();}break;case 'buyerName':if(x){x.buyerName=e.target.value;save();const d=$('#draftCopy');if(d)d.textContent=makeDraft(x);}break;case 'buyerRole':if(x){x.buyerRole=e.target.value;save();}break;case 'csvfile':if(e.target.files[0])importCSV(e.target.files[0]);e.target.value='';break;}});
const fileInput=document.createElement('input');fileInput.type='file';fileInput.accept='.csv,text/csv';fileInput.id='csvfile';fileInput.className='filepick';fileInput.setAttribute('aria-label','Import Apollo CSV file');document.body.append(fileInput);
const style=document.createElement('style');style.textContent='.toast{position:fixed;right:18px;bottom:18px;max-width:350px;background:#1f4030;color:white;padding:13px 16px;border-radius:10px;box-shadow:0 14px 35px #153f2b30;font-size:12px;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none;z-index:99}.toast.show{opacity:1;transform:translateY(0)}';document.head.append(style);
render();
})();
</script>
</body>
